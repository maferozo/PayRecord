{% extends "base.html" %}
{# Layout estrecho y centrado para las pantallas de autenticación #}

{% block contenido %}
<div class="row justify-content-center py-lg-4">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">

    <div class="text-center mb-4">
      <span class="pr-marca-icono d-inline-flex mb-3" style="width:52px; height:52px; font-size:1.4rem;">
        <i class="bi bi-shield-check"></i>
      </span>
      <h1 class="h4 mb-1">{% block auth_titulo %}{% endblock %}</h1>
      <p class="text-secondary small mb-0">{% block auth_subtitulo %}{% endblock %}</p>
    </div>

    <div class="pr-tarjeta p-4 p-md-5">
      {% block auth_contenido %}{% endblock %}
    </div>

    {% block auth_pie %}{% endblock %}
  </div>
</div>
{% endblock %}
