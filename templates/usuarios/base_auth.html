{% extends "base.html" %}
{# Layout estrecho y centrado para las pantallas de autenticación #}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">
    <div class="pr-tarjeta p-4 p-md-5">
      <h1 class="h4 mb-1">{% block auth_titulo %}{% endblock %}</h1>
      <p class="text-secondary small mb-4">{% block auth_subtitulo %}{% endblock %}</p>

      {% block auth_contenido %}{% endblock %}
    </div>

    {% block auth_pie %}{% endblock %}
  </div>
</div>
{% endblock %}
